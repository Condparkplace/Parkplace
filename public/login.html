<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Acesso - Park Place Residencial</title>
  <link rel="stylesheet" href="/css/style.css?v=4" />
</head>
<body>
  <div class="login-wrap">
    <div class="login-card">
      <div class="logo">
        <span class="login-badge">&#127970;</span>
        <h1>Park Place Residencial</h1>
        <p>Sistema de Controle de Portaria</p>
      </div>

      <form id="form-login">
        <label for="email">E-mail ou Nome</label>
        <input type="text" id="email" placeholder="seu@email.com ou seu nome" autocomplete="username" required />

        <label for="password">Senha</label>
        <div class="password-wrap">
          <input type="password" id="password" placeholder="Sua senha" autocomplete="current-password" required />
          <button type="button" class="btn-toggle-senha" onclick="toggleSenha('password', this)" title="Ver senha" aria-label="Mostrar ou ocultar senha">
            <svg class="eye-open" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"></path>
              <circle cx="12" cy="12" r="3"></circle>
            </svg>
            <svg class="eye-closed hidden" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"></path>
              <line x1="1" y1="1" x2="23" y2="23"></line>
            </svg>
          </button>
        </div>

        <div style="margin-bottom:16px;">
          <label class="row-inline" style="justify-content:flex-start; align-items:center; cursor:pointer; font-weight:normal; user-select:none;">
            <input type="checkbox" id="rememberMe" style="width:auto; margin:0 8px 0 0;" />
            Manter-me logado (confiar neste navegador)
          </label>
        </div>

        <button type="submit" class="block" id="btn-entrar">Entrar</button>
      </form>

      <div id="msg" class="msg hidden"></div>

      <p style="text-align:center; margin-top:16px;">
        <a href="#" id="link-esqueci" style="color:var(--verde); font-weight:600; text-decoration:none;">Esqueci minha senha</a>
      </p>

      <p style="text-align:center; margin-top:10px;">
        <a href="/" class="text-muted" style="text-decoration:none;">&#8592; Voltar ao site</a>
      </p>
    </div>
  </div>

  <!-- Modal: Esqueci minha senha -->
  <div id="modal-esqueci" class="hidden"
    style="position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.5); z-index:999; display:flex; align-items:center; justify-content:center; padding:16px; box-sizing:border-box;">
    <div class="card" style="width:100%; max-width:420px; margin:20px;">
      <h3 style="margin-top:0;">Recuperar senha</h3>
      <p class="text-muted" style="margin:0 0 14px; font-size:14px;">
        Informe o e-mail do seu cadastro. Enviaremos um link para você criar uma nova senha.
      </p>
      <form id="form-esqueci">
        <label for="esqueci-email">E-mail</label>
        <input type="email" id="esqueci-email" placeholder="seu@email.com" autocomplete="email" required />
        <div id="msg-esqueci" class="msg hidden" style="margin-top:12px;"></div>
        <div class="grid grid-2" style="margin-top:16px;">
          <button type="button" class="secundario block" onclick="fecharEsqueci()">Cancelar</button>
          <button type="submit" class="block" id="btn-esqueci">Enviar link</button>
        </div>
      </form>
    </div>
  </div>

  <script src="/js/api.js?v=2"></script>
  <script>
    const form = document.getElementById('form-login');
    const msg = document.getElementById('msg');
    const btn = document.getElementById('btn-entrar');

    // Se ja estiver logado, redireciona direto.
    (async () => {
      try {
        const { perfil } = await api('/api/me');
        redirecionarPorTipo(perfil.tipo);
      } catch {}
    })();

    form.addEventListener('submit', async (e) => {
      e.preventDefault();
      msg.classList.add('hidden');
      btn.disabled = true;
      btn.textContent = 'Entrando...';
      try {
        const loginValor = document.getElementById('email').value.trim();
        const { perfil } = await api('/api/login', {
          method: 'POST',
          body: JSON.stringify({
            login: loginValor,
            email: loginValor,
            password: document.getElementById('password').value,
            rememberMe: document.getElementById('rememberMe').checked,
          }),
        });
        redirecionarPorTipo(perfil.tipo);
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg erro';
        btn.disabled = false;
        btn.textContent = 'Entrar';
      }
    });

    // ---------- Esqueci minha senha ----------
    const modalEsqueci = document.getElementById('modal-esqueci');
    document.getElementById('link-esqueci').addEventListener('click', (e) => {
      e.preventDefault();
      document.getElementById('esqueci-email').value = document.getElementById('email').value.includes('@')
        ? document.getElementById('email').value.trim() : '';
      document.getElementById('msg-esqueci').classList.add('hidden');
      modalEsqueci.classList.remove('hidden');
      modalEsqueci.style.display = 'flex';
      setTimeout(() => document.getElementById('esqueci-email').focus(), 50);
    });

    function fecharEsqueci() {
      modalEsqueci.classList.add('hidden');
      modalEsqueci.style.display = 'none';
    }

    document.getElementById('form-esqueci').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btnE = document.getElementById('btn-esqueci');
      const msgE = document.getElementById('msg-esqueci');
      const email = document.getElementById('esqueci-email').value.trim();
      msgE.classList.add('hidden');
      if (!email || !email.includes('@')) {
        msgE.textContent = 'Informe um e-mail válido.';
        msgE.className = 'msg erro';
        msgE.classList.remove('hidden');
        return;
      }
      btnE.disabled = true;
      btnE.textContent = 'Enviando...';
      try {
        await api('/api/esqueci-senha', { method: 'POST', body: JSON.stringify({ email }) });
        msgE.textContent = 'Se este e-mail tiver cadastro, enviamos um link para redefinir a senha. Verifique sua caixa de entrada e o spam.';
        msgE.className = 'msg ok';
        msgE.classList.remove('hidden');
      } catch (err) {
        // Mesmo em erro, mantém mensagem genérica (não revela se o e-mail existe).
        msgE.textContent = 'Se este e-mail tiver cadastro, enviamos um link para redefinir a senha. Verifique sua caixa de entrada e o spam.';
        msgE.className = 'msg ok';
        msgE.classList.remove('hidden');
      } finally {
        btnE.disabled = false;
        btnE.textContent = 'Enviar link';
      }
    });
  </script>
</body>
</html>

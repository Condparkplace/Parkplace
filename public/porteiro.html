<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Portaria - Park Place</title>
  <link rel="stylesheet" href="/css/style.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand">
      &#128682; Park Place <span class="sub">&middot; Portaria</span>
    </div>
    <div class="user-area">
      <span id="nome-usuario"></span>
      <button class="secundario mini" onclick="logout()">Sair</button>
    </div>
  </div>

  <div class="container">
    <div class="tabs">
      <button class="ativo" data-tab="entrada" onclick="trocarAba('entrada')">Registrar entrada</button>
      <button data-tab="presentes" onclick="trocarAba('presentes')">No condominio</button>
      <button data-tab="historico" onclick="trocarAba('historico')">Historico</button>
    </div>

    <!-- Registrar entrada (unificada com busca) -->
    <section id="tab-entrada" class="card">
      <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:8px; margin:0 0 16px;">
        <h2 style="margin:0;">Registrar entrada</h2>
        <span class="badge porteiro" style="font-size:13px;">&#128110; Porteiro de plantao: <strong id="porteiro-plantao"></strong></span>
      </div>

      <!-- Busca rapida por documento -->
      <div style="background:var(--verde-claro); border-radius:8px; padding:14px; margin:0 0 18px;">
        <label for="busca-doc" style="margin-top:0;">Buscar por CPF/documento (preenche automatico se ja tiver cadastro)</label>
        <div class="row-inline" style="align-items:center;">
          <input type="text" id="busca-doc" placeholder="Digite o CPF ou documento" style="flex:1; min-width:200px;" />
          <button type="button" class="mini" id="btn-buscar-doc" onclick="buscarPorDocumento()">Buscar</button>
          <button type="button" class="secundario mini" onclick="limparFormEntrada()">Limpar</button>
        </div>
        <div id="msg-busca" class="msg hidden" style="margin-top:10px;"></div>
      </div>

      <form id="form-entrada" class="hidden">
        <div class="grid grid-2">
          <div>
            <label for="nome_pessoa">Nome *</label>
            <input type="text" id="nome_pessoa" required />
          </div>
          <div>
            <label for="tipo">Tipo</label>
            <select id="tipo">
              <option value="Visitante">Visitante</option>
              <option value="Prestador">Prestador de servico</option>
              <option value="Entregador">Entregador</option>
              <option value="Outro">Outro</option>
            </select>
          </div>
          <div>
            <label for="documento">Documento</label>
            <input type="text" id="documento" />
          </div>
          <div>
            <label for="veiculo_placa">Veiculo / placa</label>
            <input type="text" id="veiculo_placa" />
          </div>
          <div>
            <label for="destino_bloco">Lote de destino</label>
            <select id="destino_bloco">
              <option value="">Selecione o Lote</option>
              <option value="Lote 01">Lote 01</option>
              <option value="Lote 02">Lote 02</option>
              <option value="Lote 03">Lote 03</option>
              <option value="Lote 04">Lote 04</option>
              <option value="Lote 05">Lote 05</option>
              <option value="Lote 06">Lote 06</option>
              <option value="Lote 07">Lote 07</option>
              <option value="Lote 08">Lote 08</option>
              <option value="Lote 09">Lote 09</option>
              <option value="Lote 10">Lote 10</option>
              <option value="Lote 11">Lote 11</option>
              <option value="Lote 12">Lote 12</option>
              <option value="Lote 13">Lote 13</option>
              <option value="Lote 14">Lote 14</option>
              <option value="Lote 15">Lote 15</option>
              <option value="Lote 16">Lote 16</option>
              <option value="Lote 17">Lote 17</option>
              <option value="Lote 18">Lote 18</option>
              <option value="Lote 19">Lote 19</option>
              <option value="Lote 20">Lote 20</option>
              <option value="Lote 21">Lote 21</option>
              <option value="Lote 22">Lote 22</option>
              <option value="Lote 23">Lote 23</option>
              <option value="Lote 24">Lote 24</option>
              <option value="Lote 25">Lote 25</option>
              <option value="Lote 26">Lote 26</option>
              <option value="Lote 27">Lote 27</option>
              <option value="Lote 28">Lote 28</option>
            </select>
          </div>
        </div>

        <!-- Endereco do visitante (busca por CEP) -->
        <h3 style="margin:18px 0 4px;">Endereco do visitante</h3>
        <div class="grid grid-2">
          <div>
            <label for="cep">CEP</label>
            <div class="row-inline" style="align-items:center;">
              <input type="text" id="cep" placeholder="00000-000" maxlength="9" style="flex:1; min-width:120px;" />
              <button type="button" class="mini" id="btn-buscar-cep" onclick="buscarPorCep()">Buscar CEP</button>
            </div>
            <span id="msg-cep" class="text-muted"></span>
          </div>
          <div>
            <label for="end_numero">Numero</label>
            <input type="text" id="end_numero" placeholder="Ex: 123" />
          </div>
          <div>
            <label for="end_logradouro">Logradouro</label>
            <input type="text" id="end_logradouro" placeholder="Rua / Avenida" />
          </div>
          <div>
            <label for="end_bairro">Bairro</label>
            <input type="text" id="end_bairro" />
          </div>
          <div>
            <label for="end_cidade">Cidade / UF</label>
            <div class="row-inline">
              <input type="text" id="end_cidade" placeholder="Cidade" style="flex:3;" />
              <input type="text" id="end_uf" placeholder="UF" maxlength="2" style="flex:1; min-width:56px; text-transform:uppercase;" />
            </div>
          </div>
        </div>

        <label for="observacao">Observacao</label>
        <textarea id="observacao"></textarea>
        <input type="hidden" id="aviso_id" />
        <button type="submit" class="block" id="btn-entrada">Confirmar entrada</button>
      </form>
      <div id="msg-entrada" class="msg hidden"></div>

      <!-- Lista de visitas previstas (sempre visivel) -->
      <div id="painel-previstas" style="margin-top:22px; border-top:2px solid var(--cinza-borda); padding-top:16px;">
        <h3 style="margin:0 0 12px;">Visitas avisadas pelos moradores</h3>
        <div id="lista-previstas"><p class="vazio">Carregando...</p></div>
      </div>
    </section>

    <!-- Presentes -->
    <section id="tab-presentes" class="card hidden">
      <h2>Pessoas atualmente no condominio</h2>
      <div id="lista-presentes"><p class="vazio">Carregando...</p></div>
    </section>

    <!-- Historico -->
    <section id="tab-historico" class="card hidden">
      <h2>Historico de acessos</h2>
      <div class="row-inline" style="margin-bottom:14px;">
        <div>
          <label for="de">De</label>
          <input type="date" id="de" />
        </div>
        <div>
          <label for="ate">Ate</label>
          <input type="date" id="ate" />
        </div>
        <div style="display:flex; align-items:flex-end;">
          <button class="mini" onclick="carregarHistorico()">Filtrar</button>
        </div>
      </div>
      <div id="lista-historico"><p class="vazio">Carregando...</p></div>
    </section>
  </div>

  <script src="/js/api.js"></script>
  <script>
    let perfil = null;

    (async () => {
      perfil = await protegerPagina('porteiro');
      if (!perfil) return;
      document.getElementById('nome-usuario').textContent = perfil.nome;
      document.getElementById('porteiro-plantao').textContent = perfil.nome;
      document.getElementById('busca-doc').focus();
      carregarPrevistas();
    })();

    function trocarAba(aba) {
      document.querySelectorAll('.tabs button').forEach((b) =>
        b.classList.toggle('ativo', b.dataset.tab === aba)
      );
      ['entrada', 'presentes', 'historico'].forEach((t) =>
        document.getElementById('tab-' + t).classList.toggle('hidden', t !== aba)
      );
      if (aba === 'entrada') { document.getElementById('busca-doc').focus(); carregarPrevistas(); }
      if (aba === 'presentes') carregarPresentes();
      if (aba === 'historico') carregarHistorico();
    }

    // Exibe o formulario de entrada (chamado apos buscar ou escolher um aviso).
    function mostrarFormEntrada() {
      document.getElementById('form-entrada').classList.remove('hidden');
    }

    // ---------- Visitas previstas ----------
    let avisosHoje = []; // cache dos avisos previstos para hoje

    // Mantem apenas avisos cuja data prevista seja hoje (ou nula, para mostrar os antigos sem data).
    function ehHoje(iso) {
      if (!iso) return true;
      const d = new Date(iso);
      const h = new Date();
      return d.getFullYear() === h.getFullYear()
        && d.getMonth() === h.getMonth()
        && d.getDate() === h.getDate();
    }

    // Renderiza a lista. Se filtroCpf for informado, mostra so a linha daquele CPF.
    async function carregarPrevistas(filtroCpf) {
      const alvo = document.getElementById('lista-previstas');
      try {
        const { avisos } = await api('/api/portaria/avisos');
        avisosHoje = (avisos || []).filter((a) => ehHoje(a.data_prevista));

        let lista = avisosHoje;
        if (filtroCpf) {
          const alvoCpf = filtroCpf.replace(/\D/g, '');
          lista = avisosHoje.filter(
            (a) => (a.documento_visitante || '').replace(/\D/g, '') === alvoCpf
          );
        }

        if (!lista.length) {
          alvo.innerHTML = filtroCpf
            ? '<p class="vazio">Nenhuma visita prevista para hoje com este documento.</p>'
            : '<p class="vazio">Nenhuma visita prevista para hoje.</p>';
          return;
        }
        alvo.innerHTML = `
          <table>
            <thead>
              <tr><th>Visitante</th><th>Tipo</th><th>Morador / destino</th><th>Previsto</th><th>Status</th><th></th></tr>
            </thead>
            <tbody>
              ${lista.map((a) => {
                const m = a.morador || {};
                const destino = m.bloco || '';
                
                let btnStyle = '';
                if (a.nome_visitante === 'Entregador iFood') {
                  btnStyle = 'background-color: #ea1d2c; color: white;';
                } else if (a.tipo === 'Prestador') {
                  btnStyle = 'background-color: #2b6cb0; color: white;';
                }

                return `
                  <tr>
                    <td>${escapeHtml(a.nome_visitante)}<br><span class="text-muted">${escapeHtml(a.veiculo_placa || '')}</span></td>
                    <td>${escapeHtml(a.tipo)}</td>
                    <td>${escapeHtml(m.nome || '-')}<br><span class="text-muted">${escapeHtml(destino)}${m.telefone ? ' | ' + escapeHtml(m.telefone) : ''}</span></td>
                    <td>${formatarData(a.data_prevista)}</td>
                    <td>${badgeStatus(a.status)}</td>
                    <td>
                      <div class="row-inline" style="justify-content: flex-end;">
                        <button class="mini" style="${btnStyle}" onclick='registrarDeAviso(${JSON.stringify(a).replace(/'/g, "&#39;")})'>Registrar entrada</button>
                        <button class="secundario mini" onclick="marcarNaoVeio(${a.id})">Nao veio</button>
                      </div>
                    </td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>
          ${filtroCpf ? '<p class="text-muted" style="margin-top:10px;">Mostrando so a visita prevista para este documento. <a href="#" onclick="limparFiltroPrevistas(event)">Ver todas</a></p>' : ''}`;
      } catch (err) {
        alvo.innerHTML = `<p class="msg erro">${escapeHtml(err.message)}</p>`;
      }
    }

    // Remove o filtro por CPF da lista de previstas.
    function limparFiltroPrevistas(ev) {
      if (ev) ev.preventDefault();
      carregarPrevistas();
    }

    async function registrarEntradaRapida(aviso) {
      const m = aviso.morador || {};
      try {
        await api('/api/portaria/entrada', {
          method: 'POST',
          body: JSON.stringify({
            aviso_id: aviso.id,
            nome_pessoa: aviso.nome_visitante,
            tipo: aviso.tipo,
            documento: '',
            veiculo_placa: '',
            destino_bloco: m.bloco || '',
            endereco_visitante: null,
            cep_visitante: null,
            observacao: aviso.observacao || ''
          }),
        });
        carregarPrevistas();
        alert('Entrada rápida registrada com sucesso por ' + perfil.nome + '!');
      } catch (err) {
        alert('Erro: ' + err.message);
      }
    }

    function registrarDeAviso(aviso) {
      if (aviso.nome_visitante === 'Entregador iFood') {
        registrarEntradaRapida(aviso);
        return;
      }
      const m = aviso.morador || {};
      document.getElementById('nome_pessoa').value = aviso.nome_visitante || '';
      document.getElementById('tipo').value = aviso.tipo || 'Visitante';
      document.getElementById('documento').value = aviso.documento_visitante || '';
      document.getElementById('veiculo_placa').value = aviso.veiculo_placa || '';
      document.getElementById('destino_bloco').value = m.bloco || '';
      if (aviso.cep_visitante) document.getElementById('cep').value = aviso.cep_visitante;
      if (aviso.endereco_visitante) {
        document.getElementById('msg-cep').textContent = 'Endereco informado pelo morador: ' + aviso.endereco_visitante;
        document.getElementById('msg-cep').style.color = 'var(--verde-escuro)';
      }
      document.getElementById('aviso_id').value = aviso.id || '';
      // Revela o formulario preenchido.
      mostrarFormEntrada();
      document.getElementById('form-entrada').scrollIntoView({ behavior: 'smooth' });
    }

    // Marca a visita como "nao compareceu" e manda direto para o historico.
    async function marcarNaoVeio(id) {
      if (!confirm('Marcar esta visita como "nao veio"? Ela ira direto para o historico.')) return;
      try {
        await api(`/api/portaria/avisos/${id}/nao-veio`, { method: 'POST' });
        carregarPrevistas();
      } catch (err) {
        alert(err.message);
      }
    }

    // ---------- Busca por documento ----------
    async function buscarPorDocumento() {
      const doc = document.getElementById('busca-doc').value.trim();
      const msg = document.getElementById('msg-busca');
      const btn = document.getElementById('btn-buscar-doc');
      msg.classList.add('hidden');
      if (!doc) {
        msg.textContent = 'Digite um documento para buscar.';
        msg.className = 'msg erro';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Buscando...';
      try {
        const docLimpo = doc.replace(/\D/g, '');

        // OPCAO 1: existe aviso previsto para HOJE com este documento?
        // Atualiza o cache de previstas e procura nele.
        await carregarPrevistas();
        const avisoHoje = avisosHoje.find(
          (a) => (a.documento_visitante || '').replace(/\D/g, '') === docLimpo && docLimpo
        );
        if (avisoHoje) {
          // Mostra so a linha deste documento e NAO abre o formulario.
          formEntrada.classList.add('hidden');
          await carregarPrevistas(doc);
          msg.textContent = 'Visita prevista para hoje encontrada na lista abaixo. Use "Registrar entrada" na linha.';
          msg.className = 'msg ok';
          document.getElementById('painel-previstas').scrollIntoView({ behavior: 'smooth' });
          return;
        }

        // OPCAO 2 e 3: nao ha aviso hoje -> busca cadastro anterior pelo documento.
        const r = await api('/api/portaria/buscar?documento=' + encodeURIComponent(doc));
        if (!r.encontrado) {
          // Nao cadastrado: abre o formulario em branco so com o documento, para cadastrar e dar entrada.
          formEntrada.reset();
          document.getElementById('aviso_id').value = '';
          document.getElementById('msg-cep').textContent = '';
          mostrarFormEntrada();
          msg.textContent = 'Nenhum cadastro encontrado. Preencha os dados para cadastrar o visitante e registrar a entrada.';
          msg.className = 'msg erro';
          document.getElementById('documento').value = doc;
          document.getElementById('nome_pessoa').focus();
          return;
        }
        // Cadastrado: preenche os dados e mostra o formulario para confirmar.
        mostrarFormEntrada();
        const p = r.pessoa;
        document.getElementById('nome_pessoa').value = p.nome_pessoa || '';
        document.getElementById('tipo').value = p.tipo || 'Visitante';
        document.getElementById('documento').value = p.documento || doc;
        document.getElementById('veiculo_placa').value = p.veiculo_placa || '';
        document.getElementById('destino_bloco').value = p.destino_bloco || '';
        if (p.cep_visitante) document.getElementById('cep').value = p.cep_visitante;
        if (p.endereco_visitante) {
          document.getElementById('msg-cep').textContent = 'Endereco do cadastro anterior: ' + p.endereco_visitante;
          document.getElementById('msg-cep').style.color = 'var(--verde-escuro)';
        }
        const fonte = r.origem === 'aviso' ? 'aviso de visita do morador' : 'visita anterior';
        msg.textContent = 'Cadastro encontrado (' + fonte + '). Confira os dados e confirme a entrada.';
        msg.className = 'msg ok';
      } catch (err) {
        msg.textContent = err.message;
        msg.className = 'msg erro';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Buscar';
      }
    }

    function limparFormEntrada() {
      formEntrada.reset();
      document.getElementById('aviso_id').value = '';
      document.getElementById('busca-doc').value = '';
      document.getElementById('msg-busca').classList.add('hidden');
      document.getElementById('msg-cep').textContent = '';
      formEntrada.classList.add('hidden');
      carregarPrevistas(); // volta a lista completa de hoje
      document.getElementById('busca-doc').focus();
    }

    // Busca ao pressionar Enter no campo de documento
    document.getElementById('busca-doc').addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); buscarPorDocumento(); }
    });

    // ---------- Busca por CEP (ViaCEP) ----------
    const campoCep = document.getElementById('cep');

    // Mascara simples 00000-000
    campoCep.addEventListener('input', () => {
      let v = campoCep.value.replace(/\D/g, '').slice(0, 8);
      if (v.length > 5) v = v.slice(0, 5) + '-' + v.slice(5);
      campoCep.value = v;
    });

    // Busca automatica ao sair do campo (se tiver 8 digitos) e com Enter.
    campoCep.addEventListener('blur', () => {
      if (campoCep.value.replace(/\D/g, '').length === 8) buscarPorCep();
    });
    campoCep.addEventListener('keydown', (e) => {
      if (e.key === 'Enter') { e.preventDefault(); buscarPorCep(); }
    });

    async function buscarPorCep() {
      const msg = document.getElementById('msg-cep');
      const btn = document.getElementById('btn-buscar-cep');
      const cep = campoCep.value.replace(/\D/g, '');
      msg.textContent = '';
      msg.style.color = '';
      if (cep.length !== 8) {
        msg.textContent = 'Digite um CEP com 8 digitos.';
        msg.style.color = 'var(--vermelho)';
        return;
      }
      btn.disabled = true;
      btn.textContent = 'Buscando...';
      try {
        const resp = await fetch(`https://viacep.com.br/ws/${cep}/json/`);
        const dados = await resp.json();
        if (dados.erro) {
          msg.textContent = 'CEP nao encontrado.';
          msg.style.color = 'var(--vermelho)';
          return;
        }
        document.getElementById('end_logradouro').value = dados.logradouro || '';
        document.getElementById('end_bairro').value = dados.bairro || '';
        document.getElementById('end_cidade').value = dados.localidade || '';
        document.getElementById('end_uf').value = dados.uf || '';
        msg.textContent = 'Endereco preenchido. Informe o numero.';
        msg.style.color = 'var(--verde-escuro)';
        document.getElementById('end_numero').focus();
      } catch (err) {
        msg.textContent = 'Nao foi possivel consultar o CEP (verifique a internet).';
        msg.style.color = 'var(--vermelho)';
      } finally {
        btn.disabled = false;
        btn.textContent = 'Buscar CEP';
      }
    }

    // Monta o endereco completo em uma string para salvar no registro.
    function montarEnderecoVisitante() {
      const cep = document.getElementById('cep').value.trim();
      const log = document.getElementById('end_logradouro').value.trim();
      const num = document.getElementById('end_numero').value.trim();
      const bairro = document.getElementById('end_bairro').value.trim();
      const cidade = document.getElementById('end_cidade').value.trim();
      const uf = document.getElementById('end_uf').value.trim().toUpperCase();

      if (!log && !cidade && !cep) return null;
      let linha = log;
      if (num) linha += ', ' + num;
      const partes = [linha, bairro, [cidade, uf].filter(Boolean).join('/')]
        .filter(Boolean).join(', ');
      return (partes + (cep ? ' - CEP ' + cep : '')).trim();
    }

    // ---------- Registrar entrada ----------
    const formEntrada = document.getElementById('form-entrada');
    const msgEntrada = document.getElementById('msg-entrada');
    formEntrada.addEventListener('submit', async (e) => {
      e.preventDefault();
      msgEntrada.classList.add('hidden');
      try {
        await api('/api/portaria/entrada', {
          method: 'POST',
          body: JSON.stringify({
            aviso_id: document.getElementById('aviso_id').value || null,
            nome_pessoa: document.getElementById('nome_pessoa').value.trim(),
            tipo: document.getElementById('tipo').value,
            documento: document.getElementById('documento').value.trim(),
            veiculo_placa: document.getElementById('veiculo_placa').value.trim(),
            destino_bloco: document.getElementById('destino_bloco').value.trim(),
            endereco_visitante: montarEnderecoVisitante(),
            cep_visitante: document.getElementById('cep').value.trim() || null,
            observacao: document.getElementById('observacao').value.trim(),
          }),
        });
        formEntrada.reset();
        document.getElementById('aviso_id').value = '';
        document.getElementById('msg-cep').textContent = '';
        document.getElementById('busca-doc').value = '';
        document.getElementById('msg-busca').classList.add('hidden');
        formEntrada.classList.add('hidden');
        msgEntrada.textContent = 'Entrada registrada com sucesso por ' + perfil.nome + '.';
        msgEntrada.className = 'msg ok';
        document.getElementById('busca-doc').focus();
        carregarPrevistas();
      } catch (err) {
        msgEntrada.textContent = err.message;
        msgEntrada.className = 'msg erro';
      }
    });

    // ---------- Presentes ----------
    async function carregarPresentes() {
      const alvo = document.getElementById('lista-presentes');
      try {
        const { presentes } = await api('/api/portaria/presentes');
        if (!presentes.length) {
          alvo.innerHTML = '<p class="vazio">Ninguem registrado dentro do condominio agora.</p>';
          return;
        }
        alvo.innerHTML = `
          <table>
            <thead>
              <tr><th>Nome</th><th>Tipo</th><th>Destino</th><th>Entrada</th><th>Porteiro</th><th></th></tr>
            </thead>
            <tbody>
              ${presentes.map((r) => {
                const destino = r.destino_bloco || '-';
                return `
                  <tr>
                    <td>${escapeHtml(r.nome_pessoa)}<br><span class="text-muted">${escapeHtml(r.veiculo_placa || '')}</span></td>
                    <td>${escapeHtml(r.tipo)}</td>
                    <td>${escapeHtml(destino || '-')}</td>
                    <td>${formatarData(r.entrada)}</td>
                    <td>${escapeHtml(r.porteiro_entrada || '-')}</td>
                    <td><button class="perigo mini" onclick="registrarSaida(${r.id})">Registrar saida</button></td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>`;
      } catch (err) {
        alvo.innerHTML = `<p class="msg erro">${escapeHtml(err.message)}</p>`;
      }
    }

    async function registrarSaida(id) {
      try {
        await api(`/api/portaria/saida/${id}`, { method: 'POST' });
        carregarPresentes();
      } catch (err) {
        alert(err.message);
      }
    }

    // ---------- Historico ----------
    async function carregarHistorico() {
      const alvo = document.getElementById('lista-historico');
      const de = document.getElementById('de').value;
      const ate = document.getElementById('ate').value;
      const params = new URLSearchParams();
      if (de) params.set('de', new Date(de + 'T00:00:00').toISOString());
      if (ate) params.set('ate', new Date(ate + 'T23:59:59').toISOString());
      try {
        const { registros } = await api('/api/portaria/historico?' + params.toString());
        if (!registros.length) {
          alvo.innerHTML = '<p class="vazio">Nenhum registro no periodo.</p>';
          return;
        }
        alvo.innerHTML = `
          <table>
            <thead>
              <tr><th>Nome</th><th>Tipo</th><th>Destino</th><th>Entrada</th><th>Saida</th><th>Porteiro</th></tr>
            </thead>
            <tbody>
              ${registros.map((r) => {
                const destino = r.destino_bloco || '-';
                const naoVeio = r.status === 'Nao compareceu';
                let saidaCol;
                if (naoVeio) saidaCol = '<span class="badge cancelada">Nao compareceu</span>';
                else if (r.saida) saidaCol = formatarData(r.saida);
                else saidaCol = '<span class="badge entrada">No local</span>';
                let porteiroCol;
                if (naoVeio) {
                  porteiroCol = `<span class="text-muted">Nao veio:</span> ${escapeHtml(r.porteiro_nao_veio || '-')}`;
                } else {
                  porteiroCol = `<span class="text-muted">Entrada:</span> ${escapeHtml(r.porteiro_entrada || '-')}`;
                  if (r.saida) porteiroCol += `<br><span class="text-muted">Saida:</span> ${escapeHtml(r.porteiro_saida || '-')}`;
                }
                return `
                  <tr>
                    <td>${escapeHtml(r.nome_pessoa)}</td>
                    <td>${escapeHtml(r.tipo)}</td>
                    <td>${escapeHtml(destino || '-')}</td>
                    <td>${naoVeio ? '<span class="text-muted">previsto ' + formatarData(r.entrada) + '</span>' : formatarData(r.entrada)}</td>
                    <td>${saidaCol}</td>
                    <td style="font-size:13px;">${porteiroCol}</td>
                  </tr>`;
              }).join('')}
            </tbody>
          </table>`;
      } catch (err) {
        alvo.innerHTML = `<p class="msg erro">${escapeHtml(err.message)}</p>`;
      }
    }
  </script>
</body>
</html>
